version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raman_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-raman_enterprise}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - raman-network

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - raman-network

  # Autonomous Literature Intelligence System - Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - raman-network

  # Autonomous Literature Intelligence System - Neo4j Knowledge Graph
  neo4j:
    image: neo4j:5.14.0
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/changeme123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - raman-network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raman_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raman_enterprise}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      # - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - db
      - redis
    networks:
      - raman-network

  sentinel:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "dev_tools/sentinel/watcher.py"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raman_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-raman_enterprise}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./dev_tools/sentinel:/app/dev_tools/sentinel
      - ./engine_core/include:/app/engine_core/include
    depends_on:
      - db
      - backend
    networks:
      - raman-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - raman-network

networks:
  raman-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

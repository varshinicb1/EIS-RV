name: RĀMAN Studio CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-asyncio

      - name: Syntax check
        run: |
          python - <<'PY'
          import ast, glob, sys
          fails = []
          for pattern in ("src/**/*.py", "tests/**/*.py", "scripts/**/*.py"):
              for f in glob.glob(pattern, recursive=True):
                  try:
                      ast.parse(open(f, encoding="utf-8").read())
                  except SyntaxError as e:
                      fails.append(f"{f}: {e}")
          if fails:
              print("\n".join(fails))
              sys.exit(1)
          print("Python syntax OK across src/, tests/, scripts/")
          PY

      - name: Run tests with coverage
        run: |
          pytest --ignore=tests/integration -v --tb=short \
            --cov=src/backend --cov=src/ai_engine \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=45

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  rust-build:
    name: Rust engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine_core/raman_core_rs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Build Rust extension
        run: |
          cd engine_core/raman_core_rs
          maturin build --release

      - name: Install wheel and verify import
        run: |
          pip install engine_core/raman_core_rs/target/wheels/*.whl --no-deps
          python -c "import raman_core_rs; print(f'raman_core_rs v{raman_core_rs.__version__} loaded OK')"

      - name: Run Rust unit tests
        run: |
          cd engine_core/raman_core_rs
          cargo test --release

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: src/frontend
        run: npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps

      - name: Test (vitest)
        working-directory: src/frontend
        run: npm run test

      - name: Build
        working-directory: src/frontend
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/ scripts/ --ignore E501

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          # Advisory only — findings are still uploaded to GitHub Security
          # so we see them, but a transitive npm dep with a known CVE
          # shouldn't block the rest of the suite. We tighten this back to
          # exit-code:1 once the SARIF is triaged in the Security tab.
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python-test, rust-build, frontend, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: raman-studio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

[package]
name = "raman-studio"
version = "3.0.0"
description = "High-performance electrochemical analysis — EIS, CV, DRT, GCD — by VidyuthLabs"
authors = ["VidyuthLabs <support@vidyuthlabs.co.in>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "raman_studio_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "raman-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
